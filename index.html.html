<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f4"><title>For Dandee ♡</title>
<style>
:root{--rose:#b65b7c;--ink:#704057}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 15% 10%,#fffaf7 0,transparent 45%),linear-gradient(150deg,#fff0f5,#f9dce7 55%,#fff6f0);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}.shell{width:min(92vw,470px);padding:38px 8px;position:relative;z-index:2}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#a16b7d;margin-bottom:25px}.panel{padding:33px 25px;background:#fffcfbeb;border:1px solid #fff;box-shadow:0 18px 60px #a9597c25;border-radius:28px;animation:rise .65s both}.panel h1{font:normal 30px/1.22 Georgia,serif;margin:8px 0 20px}.panel p{font-size:15px;line-height:1.85;margin:0 0 24px}.emoji{font-size:52px;margin:4px 0 14px}.btn{border:0;background:var(--rose);color:white;padding:14px 25px;border-radius:40px;cursor:pointer;font-weight:650;font-size:14px;box-shadow:0 8px 18px #b65b7c35;transition:transform .2s,background .2s}.btn:hover{background:#a74d6e;transform:translateY(-2px)}.btn:focus-visible,.smallbtn:focus-visible{outline:3px solid #8d345b;outline-offset:3px}.smallbtn{border:1px solid #eac6d3;background:#fff8fa;color:#98506e;border-radius:40px;padding:10px 15px;cursor:pointer;font-size:12px}.toolbar{display:flex;justify-content:center;gap:10px;margin:22px 0}.dots{display:flex;justify-content:center;gap:7px;margin-top:24px}.dot{height:7px;width:7px;border-radius:20px;background:#eac6d3;transition:width .3s}.dot.on{width:23px;background:var(--rose)}.float{position:fixed;bottom:-45px;color:#d88eaa;opacity:.3;pointer-events:none;animation:drift linear infinite;z-index:0}.envelope{position:relative;width:220px;height:150px;margin:38px auto 40px;cursor:pointer;filter:drop-shadow(0 12px 15px #b65b7c25);transition:transform .3s}.envelope:hover{transform:translateY(-5px)}.env-back{position:absolute;inset:0;background:#e6a3ba;border-radius:9px}.env-letter{position:absolute;left:24px;right:24px;top:22px;height:112px;background:#fffefa;border-radius:6px;padding-top:18px;font:italic 16px Georgia,serif;color:#b65b7c;transition:transform .75s}.env-front{position:absolute;inset:0;background:#efb3c7;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:9px}.env-flap{position:absolute;inset:0;background:#d988a6;clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:top;transition:transform .7s;z-index:3}.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}.envelope.open .env-letter{transform:translateY(-70px)}.seal{position:absolute;top:70px;left:94px;z-index:4;color:white;font-size:26px}.envelope.open .seal{opacity:0}.hint{font-size:13px;color:#a16b7d;margin-top:0}.hug{font-size:72px;animation:pulse 1.3s infinite alternate}.hidden{display:none!important}@keyframes drift{0%{transform:translateY(0) rotate(-15deg);opacity:0}20%{opacity:.35}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{to{transform:scale(1.13)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="hearts" aria-hidden="true"></div>
<main class="shell"><div class="eyebrow">a little something, just for you ♡</div>
<section id="intro" class="panel"><h1>To my favorite person,<br>Dandee ♡</h1><p>I made something for you, baby.</p><div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your love letter"><div class="env-back"></div><div class="env-letter">For you ♡</div><div class="env-front"></div><div class="env-flap"></div><div class="seal">♥</div></div><p class="hint">Tap the envelope to open 💌</p></section>
<section id="letter" class="panel hidden" aria-live="polite"><div class="emoji" id="emoji">💌</div><h1 id="title"></h1><p id="message"></p><button class="btn" id="next">Next ♡</button><div id="extra" class="toolbar"></div><div class="dots" id="dots"></div></section>

</main>
<script>
// You can change the message text between quotation marks below.
const pages=[
['💌','Hi, baby Dandee ♡','I made this little something for you. Nothing fancy, I just wanted to make you smile today.','Keep reading ♡'],
['🌷','First of all...',"I know there are moments when your mind gets a little too loud. And I know I can't always make every worry disappear. But I want you to know that you don't have to figure everything out alone.",'There’s more →'],
['🤍','Just a reminder, baby',"I'm happy with what we have. I love getting to know you more, choosing you, and being part of your days. I'm not here just for the easy and happy moments.",'One more thing ♡'],
['🫶','Even from far away...',"I may not always be there to hold your hand, but I hope you never have to question how much you mean to me. I'm here because I want to be here, baby. With you.",'A little promise →'],
['💗','My promise to you',"We'll have our worries and misunderstandings sometimes, and that's okay. I want us to keep talking, understanding each other, and choosing to work through things together. You matter to me, sobra.",'Last one, promise ♡'],
['💞','I love you, baby.',"In a room full of people, I'd still look for you. I hope this made you smile kahit konti. I'm really grateful that I have you in my life. And if you ever forget how special you are to me, you can always come back here. Love, Xyron ♡",'Read it again ↺']
];
const $=id=>document.getElementById(id);let step=0;
function show(){const p=pages[step];$('emoji').textContent=p[0];$('title').textContent=p[1];$('message').textContent=p[2];$('next').textContent=p[3];$('dots').replaceChildren(...pages.map((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===step?' on':'');return d}));$('extra').replaceChildren();if(step===pages.length-1){const b=document.createElement('button');b.className='smallbtn';b.textContent='🫂 Click here if you need a hug';b.onclick=()=>{ $('emoji').textContent='🫂';$('emoji').classList.add('hug');$('title').textContent='A big hug for you, baby ♡';$('message').textContent="I wish I could hug you right now. Until then, here's a little reminder: you are loved, you matter, and I'm here for you. ♡";b.textContent='Sending you all my hugs ♡';b.disabled=true;burst()};$('extra').append(b)}$('letter').style.animation='none';void $('letter').offsetWidth;$('letter').style.animation='rise .55s both';$('emoji').classList.remove('hug')}
$('next').onclick=()=>{step=(step+1)%pages.length;show()};let opened=false;function openLetter(){if(opened)return;opened=true;$('envelope').classList.add('open');setTimeout(()=>{$('intro').classList.add('hidden');$('letter').classList.remove('hidden');show()},800)}$('envelope').onclick=openLetter;$('envelope').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter()}};
function heart(x,delay,duration,size){const s=document.createElement('span');s.className='float';s.textContent=Math.random()>.35?'♥':'♡';s.style.left=x+'%';s.style.animationDelay=delay+'s';s.style.animationDuration=duration+'s';s.style.fontSize=size+'px';$('hearts').append(s)}for(let i=0;i<24;i++)heart(Math.random()*100,Math.random()*-15,8+Math.random()*10,32+Math.random()*34);function burst(){for(let i=0;i<12;i++)heart(Math.random()*100,0,4+Math.random()*4,48+Math.random()*35)}
</script></body></html>
